# Render Blueprint for M-Simu Finance.
#
# One Docker web service serves the frontend pages and the /api/v1 backend from
# the same origin, so no separate static site and no browser CORS setup are
# required. The database is the application's in-memory H2 instance (see the
# README's "Database persistence" section), so no Render Postgres is defined.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select the repository and
# branch. Render prompts for every `sync: false` secret below; enter the values
# documented in README.md ("Render deployment"). The JWT secret is generated by
# Render and never committed.
#
# PORT is injected by Render automatically; the application reads it and binds
# to 0.0.0.0 (server.port=${PORT:8080}).

services:
  - type: web
    name: msimu-finance
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60

    envVars:
      # Hosted-demo profile: H2 console off, JWT secret mandatory,
      # error responses stripped of internals.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Signing key for stateless JWTs. Generated once by Render and kept in
      # the service's environment; every restart signs with the same key.
      - key: TRACOM_JWT_SECRET
        generateValue: true

      # Synthetic demo portfolio (40 days of business, demo devices,
      # terminals and reconciliation runs). Safe to disable for a blank system.
      - key: TRACOM_DEMO_PORTFOLIO
        value: "true"

      # Belt and braces: the prod profile already disables the H2 console.
      - key: TRACOM_H2_CONSOLE_ENABLED
        value: "false"

      # Prototype-only: the terminal simulator plays the customer's phone
      # answering the M-PESA prompt. No real M-PESA traffic is generated.
      - key: TRACOM_SIMULATED_CUSTOMER_PHONE
        value: "true"

      # Seed credentials. Nothing is committed: Render prompts for these on
      # first Blueprint sync. Enter exactly the demo values documented in the
      # README so assessors can sign in with the published accounts, or set
      # your own and update the login-page hints in js/config.js.
      - key: TRACOM_ADMIN_PASSWORD
        sync: false
      - key: TRACOM_DEMO_PASSWORD
        sync: false
      - key: TRACOM_STAFF_PASSWORD
        sync: false
      - key: TRACOM_AGENT_PASSWORD
        sync: false
      - key: TRACOM_MERCHANT_PASSWORD
        sync: false
