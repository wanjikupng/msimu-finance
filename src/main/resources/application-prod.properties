# Production / hosted-demo profile (SPRING_PROFILES_ACTIVE=prod).
#
# Used by the Docker image and the Render deployment. The default profile stays
# the local-development profile documented in the README.

# --- Secrets must come from the environment ---
# Deliberately no default: if TRACOM_JWT_SECRET is missing or shorter than 32
# bytes, JwtService refuses to start the application (fail fast, never fall
# back to the development signing key).
app.security.jwt.secret=${TRACOM_JWT_SECRET:}

# --- Hosted demo data ---
# Keep the synthetic portfolio on so the presentation has data on first boot.
app.demo.portfolio.enabled=${TRACOM_DEMO_PORTFOLIO:true}

# --- H2 console is a development tool only ---
spring.h2.console.enabled=false

# --- Same-origin deployment: no cross-origin callers by default ---
# Set TRACOM_CORS_ALLOWED_ORIGINS only if the frontend is hosted elsewhere.
app.security.cors.allowed-origins=${TRACOM_CORS_ALLOWED_ORIGINS:}

# --- Proxied platform (Render terminates TLS and forwards the request) ---
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Do not leak implementation details in error responses ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- Logging: quiet, no SQL, no credentials ---
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.tracom.lipamdogo=INFO
