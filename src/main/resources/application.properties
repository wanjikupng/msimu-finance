spring.application.name=lipa-mdogo-mdogo

spring.datasource.url=jdbc:h2:mem:lipamdogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Stateless JWT authentication ---
# Demo default only. Override with TRACOM_JWT_SECRET in any shared/production-like
# environment. Must be at least 32 bytes.
app.security.jwt.secret=${TRACOM_JWT_SECRET:dev-only-secret-key-change-in-production-1234567890}
app.security.jwt.expiration-minutes=120

# --- Development/demo identity bootstrap ---
# The admin and demo customer accounts are created on startup when missing.
# Passwords come from configuration (never hardcoded production credentials)
# and are BCrypt-hashed before storage.
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=${TRACOM_ADMIN_EMAIL:admin@tracom.local}
app.bootstrap.admin.password=${TRACOM_ADMIN_PASSWORD:Admin@1234}
app.bootstrap.demo-customer.enabled=true
app.bootstrap.demo-customer.email=${TRACOM_DEMO_EMAIL:demo@lipamdogo.com}
app.bootstrap.demo-customer.password=${TRACOM_DEMO_PASSWORD:Demo@1234}
app.bootstrap.agent.password=${TRACOM_AGENT_PASSWORD:Agent@1234}
app.bootstrap.merchant.password=${TRACOM_MERCHANT_PASSWORD:Merchant@1234}

# --- Demo portfolio (academy/demo only) ---
# Seeds staff users, eight customers and ~40 days of financing history through
# the real services so every dashboard has data on a fresh start. Disable for
# a blank system: TRACOM_DEMO_PORTFOLIO=false
app.demo.portfolio.enabled=${TRACOM_DEMO_PORTFOLIO:true}

# --- End-of-day arrears sweep (sec min hour day month weekday) ---
app.arrears.sweep-cron=${TRACOM_ARREARS_CRON:0 5 0 * * *}

# --- Device lock ---
# Days a device stays unlocked after a missed due date before it locks.
app.device-lock.grace-days=${TRACOM_LOCK_GRACE_DAYS:2}

# --- Agent terminals (cashless, M-PESA STK push) ---
# Prototype only: lets the terminal play the customer's phone answering the
# M-PESA prompt. With a live M-PESA integration the answer arrives on the
# callback URL and this must be false.
app.payments.simulated-customer-phone=${TRACOM_SIMULATED_CUSTOMER_PHONE:true}
