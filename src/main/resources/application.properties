spring.application.name=lipa-mdogo-mdogo

spring.datasource.url=jdbc:h2:mem:lipamdogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Stateless JWT authentication ---
# Demo default only. Override with TRACOM_JWT_SECRET in any shared/production-like
# environment. Must be at least 32 bytes.
app.security.jwt.secret=${TRACOM_JWT_SECRET:dev-only-secret-key-change-in-production-1234567890}
app.security.jwt.expiration-minutes=120

# --- Development/demo identity bootstrap ---
# The admin and demo customer accounts are created on startup when missing.
# Passwords come from configuration (never hardcoded production credentials)
# and are BCrypt-hashed before storage.
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=${TRACOM_ADMIN_EMAIL:admin@tracom.local}
app.bootstrap.admin.password=${TRACOM_ADMIN_PASSWORD:Admin@1234}
app.bootstrap.demo-customer.enabled=true
app.bootstrap.demo-customer.email=${TRACOM_DEMO_EMAIL:demo@lipamdogo.com}
app.bootstrap.demo-customer.password=${TRACOM_DEMO_PASSWORD:Demo@1234}
app.bootstrap.agent.password=${TRACOM_AGENT_PASSWORD:Agent@1234}
app.bootstrap.merchant.password=${TRACOM_MERCHANT_PASSWORD:Merchant@1234}
